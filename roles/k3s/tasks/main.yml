---

# Set K3S service name based on node role
- name: "K3S::INSTALL - Set service name based on node role [{{ ansible_distribution }}]"
  ansible.builtin.set_fact:
    k3s_service_name: "{{ 'k3s-agent' if k3s_node_role == 'agent' else 'k3s' }}"
    k3s_node_labels_params: >-
      {{
        k3s_node_labels | map('regex_replace', '^(.*)$', '--node-label \1') | join(' ') | lower
      }}

# Find installed K3S Version
- name: "K3S::INSTALL - Get k3s version if installed [{{ ansible_distribution }}]"
  ansible.builtin.command: k3s --version
  register: k3s_version_output
  changed_when: false
  ignore_errors: true

# Define K3S Version as Variable if Installed
- name: "K3S::INSTALL - Define K3S Version as Variable if Installed [{{ ansible_distribution }}]"
  ansible.builtin.set_fact:
    installed_k3s_version: "{{ k3s_version_output.stdout_lines[0].split(' ')[2] }}"
  when: k3s_version_output.rc == 0

# Download and install K3S if not yet installed
- name: "K3S::INSTALL - Install K3S Block"
  when:
    - k3s_version_output.rc != 0 or installed_k3s_version is version(k3s_version, '<')
  block:

    # Create Required Directories
    - name: "K3S::INSTALL - Ensure K3S directories are created [{{ ansible_distribution }}]"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode | default('u+rwx,g+rwx,o+x') }}"
        recurse: true
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
      loop:
        - path: "{{ k3s_data_dir }}"

    # Download K3s install script
    - name: "K3S::INSTALL - Download K3s install script [{{ ansible_distribution }}]"
      ansible.builtin.get_url:
        url: "{{ k3s_install_script_url }}"
        timeout: 120
        dest: "{{ k3s_install_script }}"
        owner: root
        group: root
        mode: '0755'

    # Install K3S (Without Start)
    - name: "K3S::INSTALL - Install K3S (Without Start) [{{ ansible_distribution }}]"
      ansible.builtin.command:
        cmd: "{{ k3s_install_script }}"
      environment:
        INSTALL_K3S_SKIP_START: "true"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "{{ k3s_node_role }} --data-dir {{ k3s_data_dir }} {{ k3s_node_labels_params }} {{ k3s_install_options }}"
      args:
        creates: /usr/local/bin/k3s

# Ensure K3S is Started
- name: "K3S::INSTALL - Ensure K3S is Started [{{ ansible_distribution }}]"
  ansible.builtin.service:
    name: "{{ k3s_service_name }}"
    state: started
    sleep: 5

# K3S Health Check Block only if Enabled and Control Plane Node
- name: "K3S::HEALTHCHECK - K3S Health Check Block"
  when: k3s_health_check_enabled and k3s_node_role != "agent"
  block:

    # For server nodes, check API server health
    - name: "K3S::HEALTHCHECK - Check API server health (server only) [{{ ansible_distribution }}]"
      ansible.builtin.uri:
        url: "{{ k3s_health_check_url }}"
        method: GET
        validate_certs: false
        return_content: no
        client_cert: "{{ k3s_data_dir }}/server/tls/client-admin.crt"
        client_key: "{{ k3s_data_dir }}/server/tls/client-admin.key"
        ca_path: "{{ k3s_data_dir }}/server/tls/server-ca.crt"
      register: k3s_api_health
      retries: "{{ k3s_health_check_retries }}"
      delay: "{{ k3s_health_check_delay }}"
      until: k3s_api_health.status in k3s_health_check_accepted_codes
